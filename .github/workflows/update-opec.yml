name: Test OPEC Source

on:
  workflow_dispatch:

jobs:
  test-opec:
    runs-on: ubuntu-latest

    steps:
      - name: Test CountryEconomy
        run: |
          echo "========== TEST START =========="

          echo "Testing CountryEconomy..."

          curl -L \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -o country.html \
            -w "\nHTTP STATUS: %{http_code}\nSIZE: %{size_download}\n" \
            "https://countryeconomy.com/raw-materials/opec?year=2026"

          echo ""
          echo "========== FILE INFO =========="

          ls -lh country.html

          echo ""
          echo "========== FIRST 3000 CHARACTERS =========="

          head -c 3000 country.html

          echo ""
          echo ""
          echo "========== TEST END =========="
