name: Test OPEC Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:

      - name: Test OPEC
        run: |

          echo "Testing OPEC connection..."

          curl -L \
            -sS \
            -D headers.txt \
            -o opec.xml \
            -H "Accept: application/xml,text/xml,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "User-Agent: Mozilla/5.0" \
            "https://www.opec.org/basket/basketDayArchives.xml"

          echo ""
          echo "========== HTTP HEADERS =========="
          cat headers.txt

          echo ""
          echo "========== FILE INFO =========="
          file opec.xml

          echo ""
          echo "========== FILE SIZE =========="
          wc -c opec.xml

          echo ""
          echo "========== RESPONSE =========="
          head -c 3000 opec.xml

          echo ""
