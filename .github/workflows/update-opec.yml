name: Update OPEC Basket

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch OPEC Basket data
        run: |
          python3 <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          from datetime import datetime
          import json
          import re

          URL = "https://countryeconomy.com/raw-materials/opec?year=2026"

          print("Downloading CountryEconomy page...")

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", errors="ignore")

          print("Downloaded:", len(html), "bytes")

          class TableParser(HTMLParser):

              def __init__(self):
                  super().__init__()
                  self.in_td = False
                  self.current_row = []
                  self.current_cell = ""
                  self.rows = []

              def handle_starttag(self, tag, attrs):
                  if tag == "td" or tag == "th":
                      self.in_td = True
                      self.current_cell = ""

                  elif tag == "tr":
                      self.current_row = []

              def handle_endtag(self, tag):
                  if tag == "td" or tag == "th":
                      self.in_td = False
                      self.current_row.append(
                          self.current_cell.strip()
                      )

                  elif tag == "tr":
                      if self.current_row:
                          self.rows.append(self.current_row)

              def handle_data(self, data):
                  if self.in_td:
                      self.current_cell += data

          parser = TableParser()
          parser.feed(html)

          price = None
          date = None

          for i, row in enumerate(parser.rows):

              cells = [
                  re.sub(r"\s+", " ", c).strip()
                  for c in row
              ]

              if len(cells) >= 2:

                  first = cells[0].lower()
                  second = cells[1].lower()

                  if first == "date" and "price" in second:

                      for next_row in parser.rows[i + 1:]:

                          if len(next_row) < 2:
                              continue

                          date_candidate = next_row[0].strip()
                          price_candidate = next_row[1].strip()

                          try:
                              datetime.strptime(
                                  date_candidate,
                                  "%Y-%m-%d"
                              )

                              price_value = float(
                                  price_candidate
                                  .replace("$", "")
                                  .replace(",", "")
                                  .strip()
                              )

                              if price_value > 0:
                                  date = date_candidate
                                  price = price_value
                                  break

                          except ValueError:
                              continue

                      if price is not None:
                          break

          if price is None or date is None:
              raise RuntimeError(
                  "Could not extract OPEC Basket price"
              )

          data = {
              "success": True,
              "price": price,
              "currency": "USD",
              "unit": "barrel",
              "updated_at": date,
              "source": "CountryEconomy",
              "source_url": "https://countryeconomy.com/raw-materials/opec"
          }

          with open("opec-price.json", "w") as f:
              json.dump(
                  data,
                  f,
                  indent=4
              )

          print("OPEC Basket:")
          print(json.dumps(data, indent=4))
          PY

      - name: Upload OPEC JSON to Mihan
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: public_html/data/
          dangerous-clean-slate: false
          exclude: |
            **/*
            !opec-price.json
